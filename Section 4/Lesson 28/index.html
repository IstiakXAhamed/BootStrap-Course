<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <form>
            <div class="mb-3">
              <div class="input-group">
                <button class="btn btn-primary" type="button">Button</button>
                <input type="text" class="form-control" />
              </div>
            </div>

            <div class="mb-3">
              <div class="input-group">
                <input type="text" class="form-control" />
                <button class="btn btn-primary" type="button">Button</button>
              </div>
            </div>

            <div class="mb-3">
              <div class="input-group">
                <button class="btn btn-primary" type="button">Button</button>
                <button class="btn btn-warning" type="button">Button</button>
                <input type="text" class="form-control" />
              </div>
            </div>

            <div class="mb-3">
              <div class="input-group">
                <input type="text" class="form-control" />
                <button class="btn btn-primary" type="button">Button</button>
                <button class="btn btn-warning" type="button">Button</button>
              </div>
            </div>

            <div class="mb-3">
              <div class="input-group">
                <div class="dropdown">
                  <button
                    class="btn btn-success dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    Dropdown
                  </button>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">One</a></li>
                    <li><a class="dropdown-item" href="#">Two</a></li>
                    <li><a class="dropdown-item" href="#">Three</a></li>
                    <li><a class="dropdown-item" href="#">Four</a></li>
                  </ul>
                </div>
                <input type="text" class="form-control" />
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
