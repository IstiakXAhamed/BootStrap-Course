<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckbox" />
                <label for="defaultCheckbox" class="form-check-label">Default Checkbox</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckbox" checked/>
                <label for="defaultCheckbox" class="form-check-label">Default Checkbox</label>
            </div>

            <div class="form-check">
                <input disabled type="checkbox" class="form-check-input" value="Checked" id="defaultCheckbox" checked/>
                <label for="defaultCheckbox" class="form-check-label">Default Checkbox</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckbox" />
                <label for="defaultCheckbox" class="form-check-label">Default Checkbox</label>
            </div>


            <div class="form-check">
                <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckbox1" checked/>
                <label for="defaultCheckbox1" class="form-check-label">Default Checkbox</label>
            </div>



            <div class="form-check">
                <input type="radio" class="form-check-input" name="gender" value="Male" id="defaultRadio1" />
                <label for="defaultRadio1" class="form-check-label">Male</label>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input" value="Female" name="gender" id="defaultRadio2" />
                <label for="defaultRadio1" class="form-check-label">Female</label> 
            </div>

            <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" value="Checked" id="defaultSwitch" />
                <label for="defaultSwitch" class="form-check-label">Default Switch</label>
            </div>

            <div class="form-check form-switch">
                <input disabled type="checkbox" class="form-check-input" value="Checked" id="defaultSwitch" />
                <label for="defaultSwitch" class="form-check-label">Default Switch</label>
            </div>

               <div class="form-check form-switch">
                <input checked disabled type="checkbox" class="form-check-input" value="Checked" id="defaultSwitch" />
                <label for="defaultSwitch" class="form-check-label">Default Switch</label>
            </div>


          </form>
        </div>
      </div>
    </div>
    <script>
        var checkbox = document.getElementById("defaultCheckbox1").indeterminate = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
