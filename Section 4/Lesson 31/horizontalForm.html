<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form>
            <div class="row mb-2 g-2">
              <label
                for="email_id"
                class="col-md-2 col-form-label col-form-label-sm"
                >Email</label 
              >
              <div class="col-md-10">
                <input type="email" class="form-control form-control-sm" id="email_id" placeholder="Your Email"/>
              </div>
            </div>


             <div class="row mb-2 g-2">
              <label
                for="username"
                class="col-md-2 col-form-label col-form-label-sm"
                >Username</label 
              >
              <div class="col-md-10">
                <input type="text" class="form-control form-control-sm" id="username" placeholder="Your Username"/>
              </div>
            </div>


            <div class="row mb-2 g-2">
              <label
                for="password"
                class="col-md-2 col-form-label col-form-label-sm"
                >Password</label 
              >
              <div class="col-md-5">
                <input type="password" class="form-control form-control-sm" id="password" placeholder="Your Password"/>
              </div>

              <div class="col-md-5">
                <input type="password" class="form-control form-control-sm" id="password1" placeholder="Re-Enter Password"/>
              </div>
            </div>

            <div class="row mb-2 offset-md-2">
              <div class="col-md-10">
                <input type="submit" class="btn btn-success btn-sm" value="Sign Up to continue"/>
              </div>
            </div>



          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
