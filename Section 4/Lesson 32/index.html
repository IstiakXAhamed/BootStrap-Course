<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form class="row g-2">
            <div class="col-auto">
              <label for="name" class="visually-hidden">Name</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="name"
                placeholder="Jane Doe"
              />
            </div>
            <div class="col-auto">
              <label for="user_name" class="visually-hidden">User Name</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text">@</span>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="user_name"
                  placeholder="User Name"
                />
              </div>
            </div>

            <div class="col-auto">
              <label for="preference" class="visually-hidden">Preference</label>
              <select id="preference" class="form-select form-select-sm">
                <option selected>Choose...</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
              </select>
            </div>

            <div class="col-auto">
              <input type="checkbox" class="form-check-input" id="remember-me" />
              <label for="remember-me" class="form-check-label">Remember me</label>
            </div>
            <div class="w-100 m-0">

            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" type="submit">Sign up to get started!</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
