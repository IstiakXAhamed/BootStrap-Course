<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Hello, Sanim!</h1>
    <div class="container">
      <div class="row">
        <!-- we will divide 12 by the number of col we want , cause single row can have max 12 col !  -->
        <div class="col-md-3 col-sm-6">
          <div class="bg-primary p-3 text-white text-center mb-3">Column 1</div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="bg-primary p-3 text-white text-center mb-3">Column 2</div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="bg-primary p-3 text-white text-center mb-3">Column 3</div>
        </div>
        <div class="col-md-3 col-sm-6">
          <div class="bg-primary p-3 text-white text-center mb-3">Column 4</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
