<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <p>this is a <mark>Mark tag</mark></p>

    <p>this is a <del>Delete tag</del></p>
    <p>This is a <s>Strike tag</s></p>
    <p>This is a <ins>Ins tag</ins></p>
    <p>This is a <u>Underline Tag</u></p>

    <p>This is a <small>Small Tag</small></p>
    <p>This is a <strong>strong tag</strong></p>
    <p>This is a <em>Emphasize tag</em></p>

    <hr>

    <p>This is a <span class="mark">Mark Tag</span></p>
    <p>This is a <span class="text-decoration-line-through">Delete tag</span></p>
    <p>This is a <span class="text-decoration-underline">Underline tag</span></p>
    <p>This is a <span class="small">Small tag</span></p>





    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
