<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="conatainer mt-3">
      <div class="row">
        <div class="col-md-4">
          <figure class="figure">
            <img
              class="figure-img img-fluid rounded"
              src="https://imgs.search.brave.com/y3jhA9Soy8q9KT5a1qeTA_GzrWI-mMV-QIH_DvgH5LU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/c3RvY2t2YXVsdC5u/ZXQvZGF0YS8yMDE5/LzAzLzA2LzI2MTc3/Ni90aHVtYjE2Lmpw/Zw"
              alt="hill"
            />
            <figcaption class="figure-caption">Image Of hill</figcaption>
          </figure>
        </div>

        <div class="col-md-4">
          <figure class="figure text-center">
            <img
              class="figure-img img-fluid rounded"
              src="https://imgs.search.brave.com/y3jhA9Soy8q9KT5a1qeTA_GzrWI-mMV-QIH_DvgH5LU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/c3RvY2t2YXVsdC5u/ZXQvZGF0YS8yMDE5/LzAzLzA2LzI2MTc3/Ni90aHVtYjE2Lmpw/Zw"
              alt="hill"
            />
            <figcaption class="figure-caption">Image Of hill</figcaption>
          </figure>
        </div>

        <div class="col-md-4">
          <figure class="figure text-end">
            <img
              class="figure-img img-fluid rounded"
              src="https://imgs.search.brave.com/y3jhA9Soy8q9KT5a1qeTA_GzrWI-mMV-QIH_DvgH5LU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/c3RvY2t2YXVsdC5u/ZXQvZGF0YS8yMDE5/LzAzLzA2LzI2MTc3/Ni90aHVtYjE2Lmpw/Zw"
              alt="hill"
            />
            <figcaption class="figure-caption">Image Of hill</figcaption>
          </figure>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
